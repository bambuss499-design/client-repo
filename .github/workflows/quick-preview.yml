name: Publish previously tested prototype
on:
  push:
    paths:
      - .github/workflows/quick-preview.yml
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retrieve the already-tested build
        uses: actions/download-artifact@v4
        with:
          name: cloudnine-1.21.11
          path: /tmp/cloudnine-out
          run-id: 43803174622
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - name: Publish the artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          jar=$(find /tmp/cloudnine-out -name 'cloudnine-0.3.0.jar' -type f -print -quit)
          if [[ -z "$jar" ]]; then echo '::error::The test artifact did not contain the expected JAR'; exit 1; fi
          (cd "$(dirname "$jar")" && sha256sum "$(basename "$jar")" > cloudnine-0.3.0.jar.sha256)
          if ! gh release create cloudnine-preview-02c5408ed4e7 "$jar" "$(dirname "$jar")/cloudnine-0.3.0.jar.sha256" \
            --target 02c5408ed4e7b2cf957207c8a959db80fa56aa86 --prerelease \
            --title 'Cloud Nine 0.3.0 prototype (Minecraft 1.21.11)' \
            --notes 'Left Alt and one-session selector removal were tested with a synthetic fixture. Dgclient download is available but not yet fully tested. Other Drive clients are not included. Requires Minecraft 1.21.11, Fabric Loader 0.19.3+, Fabric API and Java 21. Quit, wait five seconds, then restart after selecting. See the README for recovery.' 2> /tmp/release-error; then
            echo "::error::$(cat /tmp/release-error | tr '\n' ' ')"
            exit 1
          fi
