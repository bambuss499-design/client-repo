name: Inspect CI screenshot
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful build run ID'
        required: true
        type: string
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: minecraft-smoke-evidence
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: evidence
      - name: Expose screenshot as an unreferenced diagnostic blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image=$(find evidence -name cloudnine-screen.png -print -quit)
          test -n "$image"
          python3 - "$image" > /tmp/blob.json <<'PY'
          import base64, json, sys
          with open(sys.argv[1], 'rb') as stream:
              print(json.dumps({'content': base64.b64encode(stream.read()).decode(), 'encoding': 'base64'}))
          PY
          sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/blob.json --jq .sha)
          echo "::notice title=Screenshot blob::$sha"
