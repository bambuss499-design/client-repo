name: Build and launch Minecraft

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, run unit tests, and prepare test mods
        run: ./gradlew --no-daemon clean build smokeHarnessJar fixtureJar
      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool imagemagick libgl1-mesa-dri libglx-mesa0
      - name: Launch real Minecraft and exercise one-shot selection
        run: xvfb-run -a -s '-screen 0 1280x720x24 -ac +extension GLX +render -noreset' bash .github/scripts/smoke.sh
      - name: Upload Minecraft screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-smoke-evidence
          path: |
            build/smoke-logs/
            build/cloudnine-screen.png
            run/logs/latest.log
            run/crash-reports/
          if-no-files-found: ignore
      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloudnine-1.21.11
          path: build/libs/cloudnine-*.jar
          if-no-files-found: error
