name: Build and launch Minecraft

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      inspect_run_id:
        description: 'Optional successful run ID for screenshot inspection only'
        type: string
        required: false
      inspect_file:
        description: 'Artifact file name to inspect'
        type: string
        default: 'cloudnine-screen.png'
      publish_preview:
        description: 'Publish a clearly labeled prototype release after all tests pass'
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

jobs:
  build-and-smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.inspect_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, run unit tests, and prepare test mods
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon clean build remapSmokeHarnessJar fixtureJar 2>&1 | tee /tmp/cloudnine-build.log; then
            python3 .github/scripts/annotate.py /tmp/cloudnine-build.log 'Gradle build failed'
            exit 1
          fi
      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Launch real Minecraft and exercise one-shot selection
        shell: bash
        run: |
          set -o pipefail
          if ! xvfb-run -a -s '-screen 0 1280x720x24 -ac +extension GLX +render -noreset' bash .github/scripts/smoke.sh 2>&1 | tee /tmp/cloudnine-smoke.log; then
            for log in build/smoke-logs/*.log build/production-evidence/latest.log; do
              if [ -f "$log" ]; then echo "=== $log ===" >> /tmp/cloudnine-smoke.log; tail -160 "$log" >> /tmp/cloudnine-smoke.log; fi
            done
            python3 .github/scripts/annotate.py /tmp/cloudnine-smoke.log 'Minecraft smoke test failed'
            exit 1
          fi
      - name: Upload Minecraft screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-smoke-evidence
          path: |
            build/smoke-logs/
            build/cloudnine-screen.png
            build/production-evidence/
          if-no-files-found: ignore
      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloudnine-1.21.11
          path: build/libs/cloudnine-*.jar
          if-no-files-found: error
      - name: Publish prototype release
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cloudnine-preview-${GITHUB_SHA:0:12}"
          gh release create "$tag" build/libs/cloudnine-0.1.0.jar \
            --target "$GITHUB_SHA" --prerelease \
            --title "Cloud Nine prototype (Minecraft 1.21.11)" \
            --notes "Prototype only: the requested Drive source clients are not included. Review the README for restart behavior, dependencies, and recovery. CI launched the remapped prototype JAR in a real Minecraft production-like client and exercised a fixture."

  inspect-screenshot:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_run_id != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: minecraft-smoke-evidence
          run-id: ${{ inputs.inspect_run_id }}
          github-token: ${{ github.token }}
          path: evidence
      - name: Expose diagnostic file as an unreferenced blob
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.inspect_file }}
        run: |
          file=$(find evidence -type f -name "$TARGET" -print -quit)
          test -n "$file"
          python3 - "$file" > /tmp/blob.json <<'PYCODE'
          import base64, json, sys
          with open(sys.argv[1], 'rb') as stream:
              print(json.dumps({'content': base64.b64encode(stream.read()).decode(), 'encoding': 'base64'}))
          PYCODE
          sha=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/blob.json --jq .sha)
          echo "::notice title=Diagnostic blob::$sha"
