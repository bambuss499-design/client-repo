name: Build Cloud Nine

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_smoke:
        description: 'Also run the optional three-launch Minecraft fixture test'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run unit tests
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon clean build 2>&1 | tee /tmp/cloudnine-build.log; then
            python3 .github/scripts/annotate.py /tmp/cloudnine-build.log 'Gradle build failed'
            exit 1
          fi
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: cloudnine-1.21.11
          path: |
            build/libs/cloudnine-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
      # Full Minecraft launches are opt-in rather than delaying every update.
      - name: Prepare optional fixture mods
        if: github.event_name == 'workflow_dispatch' && inputs.full_smoke
        run: ./gradlew --no-daemon remapSmokeHarnessJar fixtureJar replacementFixtureJar
      - name: Install virtual display
        if: github.event_name == 'workflow_dispatch' && inputs.full_smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Optional three-launch fixture smoke
        if: github.event_name == 'workflow_dispatch' && inputs.full_smoke
        shell: bash
        run: |
          set -o pipefail
          if ! xvfb-run -a -s '-screen 0 1280x720x24 -ac +extension GLX +render -noreset' bash .github/scripts/smoke.sh 2>&1 | tee /tmp/cloudnine-smoke.log; then
            for log in build/smoke-logs/*.log build/production-evidence/latest.log; do
              if [ -f "$log" ]; then echo "=== $log ===" >> /tmp/cloudnine-smoke.log; tail -160 "$log" >> /tmp/cloudnine-smoke.log; fi
            done
            python3 .github/scripts/annotate.py /tmp/cloudnine-smoke.log 'Minecraft smoke test failed'
            exit 1
          fi
      - name: Upload optional Minecraft evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.full_smoke
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-smoke-evidence
          path: |
            build/smoke-logs/
            build/cloudnine-screen.png
            build/production-evidence/
          if-no-files-found: ignore
