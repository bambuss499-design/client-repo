name: Build and launch Minecraft

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Publish a clearly labeled prototype release after all tests pass'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, run unit tests, and prepare test mods
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon clean build remapSmokeHarnessJar fixtureJar 2>&1 | tee /tmp/cloudnine-build.log; then
            python3 .github/scripts/annotate.py /tmp/cloudnine-build.log 'Gradle build failed'
            exit 1
          fi
      # Make a unit-tested build available immediately; the full Minecraft test
      # continues afterwards and is the authority for the final artifact.
      - name: Upload early build
        uses: actions/upload-artifact@v4
        with:
          name: cloudnine-0.3.1-early-build
          path: build/libs/cloudnine-0.3.1.jar
          if-no-files-found: error
      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Launch real Minecraft and exercise one-shot selection
        shell: bash
        run: |
          set -o pipefail
          if ! xvfb-run -a -s '-screen 0 1280x720x24 -ac +extension GLX +render -noreset' bash .github/scripts/smoke.sh 2>&1 | tee /tmp/cloudnine-smoke.log; then
            for log in build/smoke-logs/*.log build/production-evidence/latest.log; do
              if [ -f "$log" ]; then echo "=== $log ===" >> /tmp/cloudnine-smoke.log; tail -160 "$log" >> /tmp/cloudnine-smoke.log; fi
            done
            python3 .github/scripts/annotate.py /tmp/cloudnine-smoke.log 'Minecraft smoke test failed'
            exit 1
          fi
      - name: Upload Minecraft screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-smoke-evidence
          path: |
            build/smoke-logs/
            build/cloudnine-screen.png
            build/production-evidence/
          if-no-files-found: ignore
      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloudnine-1.21.11
          path: |
            build/libs/cloudnine-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
      - name: Publish prototype release
        if: success() && github.event_name == 'workflow_dispatch' && inputs.publish_preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="cloudnine-preview-${GITHUB_SHA:0:12}"
          (cd build/libs && sha256sum cloudnine-0.3.1.jar > cloudnine-0.3.1.jar.sha256)
          gh release create "$tag" build/libs/cloudnine-0.3.1.jar build/libs/cloudnine-0.3.1.jar.sha256 \
            --target "$GITHUB_SHA" --prerelease \
            --title "Cloud Nine 0.3.1 prototype (Minecraft 1.21.11)" \
            --notes-file - <<'NOTES'
          **Prototype only.** Dgclient can be downloaded from its published release on selection;
          the other requested Drive clients are not included.

          Requires Minecraft Java 1.21.11, Java 21, Fabric Loader 0.19.5 or newer, and Fabric API.
          Put the JAR in your mods folder and press Left Alt. Add trusted compiled Fabric JARs to
          the library folder. A source ZIP and matching JAR with the same basename appear under the
          exact ZIP filename; a source ZIP alone cannot be run. Select a JAR, quit, and restart
          Minecraft after waiting at least five seconds. Cloud Nine is removed from the selected
          session and restored after that session exits. Dependencies are not installed automatically;
          existing unrelated mods remain untouched.

          Fabric cannot safely hot-swap arbitrary mods while the game is running. If a selected
          mod crashes before the return helper starts, see the README for manual recovery. CI tested
          this remapped JAR in a real production-like Minecraft client using a synthetic fixture over three launches.
          NOTES
