name: Test Dgclient in an isolated Minecraft session

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dgclient:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build test selector and harness
        shell: bash
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon clean build remapSmokeHarnessJar fixtureJar 2>&1 | tee /tmp/dg-build.log; then
            python3 .github/scripts/annotate.py /tmp/dg-build.log 'Dgclient test build failed'
            exit 1
          fi
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Create network-isolated game container
        run: docker build -t cloudnine-dg-smoke -f .github/docker/Dockerfile.smoke .github/docker
      - name: Select and run the pinned public Dgclient release
        env:
          CLOUDNINE_SMOKE_TARGET: dgclient
          CLOUDNINE_SMOKE_DOCKER_IMAGE: cloudnine-dg-smoke
        shell: bash
        run: |
          set -o pipefail
          if ! xvfb-run -a -s '-screen 0 1280x720x24 -ac +extension GLX +render -noreset' bash .github/scripts/smoke.sh 2>&1 | tee /tmp/dg-smoke.log; then
            for log in build/smoke-logs/*.log build/production-evidence/latest.log build/production-evidence/handoff.log; do
              if [ -f "$log" ]; then echo "=== $log ===" >> /tmp/dg-smoke.log; tail -160 "$log" >> /tmp/dg-smoke.log; fi
            done
            python3 .github/scripts/annotate.py /tmp/dg-smoke.log 'Dgclient isolated Minecraft test failed'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dgclient-smoke-evidence
          path: |
            build/smoke-logs/
            build/production-evidence/
          if-no-files-found: ignore
