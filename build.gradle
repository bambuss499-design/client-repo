plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

loom {
    splitEnvironmentSourceSets()
    mods {
        cloudnine {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client {
            programArg '--width'
            programArg '1280'
            programArg '--height'
            programArg '720'
        }
    }
}

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    productionRuntimeMods("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}") { transitive = false }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
    // The selector uses its own wrapper, not a wrapper executable from a source ZIP.
    from('gradle/wrapper/gradle-wrapper.jar') { into 'cloudnine' }
}

tasks.withType(JavaCompile).configureEach { options.release = 21 }
test { useJUnitPlatform() }
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
jar { from('LICENSE') { rename { "${it}_${project.name}" } } }

// Small, local-only test mods; neither is included in the distributable.
sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    fixture {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    replacementFixture {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    sourceBuildSmoke {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register('smokeHarnessJar', Jar) {
    dependsOn tasks.named('smokeClasses')
    archiveFileName = 'cloudnine-smoke-harness.jar'
    destinationDirectory = layout.buildDirectory.dir('smoke')
    from sourceSets.smoke.output
}
tasks.register('fixtureJar', Jar) {
    dependsOn tasks.named('fixtureClasses')
    archiveFileName = 'Moonlit Fixture.jar'
    destinationDirectory = layout.buildDirectory.dir('smoke')
    from sourceSets.fixture.output
}
tasks.register('replacementFixtureJar', Jar) {
    dependsOn tasks.named('replacementFixtureClasses')
    archiveFileName = 'Starlit Replacement.jar'
    destinationDirectory = layout.buildDirectory.dir('smoke')
    from sourceSets.replacementFixture.output
}

// Minimal standalone harness for testing an actual source build in a container
// that has no repository checkout, credentials, or user's private archives.
configurations { sourceSmokeLibraries }
dependencies {
    sourceSmokeLibraries "net.fabricmc:fabric-loader:${project.loader_version}"
    sourceSmokeLibraries 'com.google.code.gson:gson:2.13.2'
}
tasks.register('sourceBuildSmokeJar', Jar) {
    dependsOn tasks.named('sourceBuildSmokeClasses')
    archiveFileName = 'cloudnine-source-smoke.jar'
    destinationDirectory = layout.buildDirectory.dir('source-smoke')
    from sourceSets.main.output
    from sourceSets.sourceBuildSmoke.output
}
tasks.register('prepareSourceBuildSmoke', Copy) {
    dependsOn tasks.named('sourceBuildSmokeJar')
    from tasks.named('sourceBuildSmokeJar')
    from configurations.sourceSmokeLibraries
    into layout.buildDirectory.dir('source-smoke-classpath')
}

// Exercise the distributable, not just development classes, using Fabric's production launcher.
tasks.register('remapSmokeHarnessJar', net.fabricmc.loom.task.RemapJarTask) {
    inputFile = tasks.named('smokeHarnessJar', Jar).flatMap { it.archiveFile }
    archiveFileName = 'cloudnine-smoke-harness-remapped.jar'
    destinationDirectory = layout.buildDirectory.dir('smoke')
    classpath.from(sourceSets.client.compileClasspath, sourceSets.main.output, sourceSets.client.output)
    addNestedDependencies = false
}
tasks.register('productionSmoke', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    // Exercise the installed selector from the normal mods folder, rather
    // than injecting it through fabric.addMods.
    mods.setFrom(configurations.productionRuntimeMods, tasks.named('remapSmokeHarnessJar'))
    runDir = file(System.getenv('CLOUDNINE_SMOKE_DIR') ?: 'run/cloudnine-ci')
    useXVFB = false // CI supplies one X server for the entire three-launch scenario.
    programArgs.addAll('--username', 'CloudNineCI', '--uuid', '00000000-0000-4000-8000-000000000001',
            '--accessToken', '0', '--version', '1.21.11', '--width', '1280', '--height', '720')
}
